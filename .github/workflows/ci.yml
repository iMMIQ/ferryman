name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install PDF test font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Require the PDF test font
        run: test -r /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
        env:
          FERRYMAN_PDF_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

  # The web binary ships in a scratch container; a plain native build here
  # catches link/bundling regressions early. Cross builds for deployment stay
  # in scripts/build-release.sh (run on the Jetson host).
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --bin ferryman-web
