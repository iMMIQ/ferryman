[workspace]
resolver = "2"
members = [
    "crates/ferryman-core",
    "crates/ferryman-cli",
    "crates/ferryman-web",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/iMMIQ/ferryman"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
backon = { version = "1.6.0", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
html-escape = "0.3.0"
httpdate = "1.0.3"
indicatif = "0.18.6"
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }
lol_html = "3.0.3"
# pdf-extract 0.12 exposes lopdf 0.42 types in its OutputDev API.
lopdf = { version = "0.42.0", default-features = false, features = ["wasm_js"] }
pdf-extract = "0.12.1"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
ring = "0.17.14"
roxmltree = "0.21.2"
# tokio-rusqlite 0.8 requires the 0.40 ABI; newer versions conflict on SQLite links.
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subsetter = "0.2.6"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite = "0.8.0"
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
ttf-parser = "0.25.1"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-script = "0.5.9"
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
zip = { version = "9.2.3", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
