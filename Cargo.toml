[package]
name = "ferryman"
version = "0.3.1"
edition = "2021"
description = "Translate EPUB, DOCX, text, Markdown and subtitles through an OpenAI-compatible model"
license = "LGPL-3.0-or-later"
repository = "https://github.com/iMMIQ/ferryman"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
lol_html = "0.4"
roxmltree = "0.20"
indicatif = "0.17"
futures = "0.3"
sha2 = "0.10"
axum = { version = "0.8", features = ["multipart"] }
hmac = "0.12"
subtle = "2"
hex = "0.4"
pulldown-cmark = "0.13"
backon = { version = "1.6", default-features = false, features = ["std"] }
httpdate = "1"
strip-ansi-escapes = "0.2"
walkdir = "2"
rustix = { version = "1", features = ["fs", "process"] }
percent-encoding = "2"
tempfile = "3"
tokio-rusqlite = "0.6"
ts-rs = { version = "12", features = ["uuid-impl"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1"
unicode-bidi = "0.3"
unicode-script = "0.5"
rustybuzz = "0.20"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
pdf-extract = "0.12"
lopdf = { version = "0.42", default-features = false, features = ["wasm_js"] }
ttf-parser = "0.25"
# PDF font subsetting (same crate krilla uses; renumbers glyph ids)
subsetter = "0.2"
html-escape = "0.2.15"
safetensors = "0.8.0"

[dev-dependencies]
# test fixtures build source PDFs with a known layout for the pdf backend
krilla = { version = "0.8", default-features = false, features = ["simple-text"] }

[profile.release]
opt-level = 2
