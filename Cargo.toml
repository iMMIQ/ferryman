[package]
name = "ferryman"
version = "0.4.2"
edition = "2021"
description = "Translate EPUB, DOCX, text, Markdown and subtitles through an OpenAI-compatible model"
license = "LGPL-3.0-or-later"
repository = "https://github.com/iMMIQ/ferryman"

[features]
default = []
# Enabled only by the MicroServer package build.
lazycat = []

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
zip = { version = "9.2.3", default-features = false, features = ["deflate"] }
lol_html = "3.0.3"
roxmltree = "0.21.2"
indicatif = "0.18.6"
futures = "0.3.34"
sha2 = "0.11.1"
axum = { version = "0.8.9", features = ["multipart"] }
hmac = "0.13.0"
subtle = "2.6.1"
hex = "0.4.3"
pulldown-cmark = "0.13.6"
backon = { version = "1.6.0", default-features = false, features = ["std"] }
httpdate = "1.0.3"
strip-ansi-escapes = "0.2.1"
walkdir = "2.5.0"
rustix = { version = "1.1.6", features = ["fs", "process"] }
percent-encoding = "2.3.2"
tempfile = "3.27.0"
tokio-rusqlite = "0.8.0"
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
unicode-bidi = "0.3.18"
unicode-script = "0.5.9"
rustybuzz = "0.20.1"
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
# tokio-rusqlite 0.8 requires the 0.40 ABI; newer versions conflict on SQLite links.
rusqlite = { version = "0.40.2", features = ["bundled"] }
pdf-extract = "0.12.1"
# pdf-extract 0.12 exposes lopdf 0.42 types in its OutputDev API.
lopdf = { version = "0.42.0", default-features = false, features = ["wasm_js"] }
ttf-parser = "0.25.1"
# PDF font subsetting (same crate krilla uses; renumbers glyph ids)
subsetter = "0.2.6"
html-escape = "0.3.0"
safetensors = "0.8.0"

[dev-dependencies]
# test fixtures build source PDFs with a known layout for the pdf backend
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }

[profile.release]
opt-level = 2
