[package]
name = "ferryman"
version = "0.3.1"
edition = "2021"
description = "Translate EPUB, DOCX, text, Markdown and subtitles through an OpenAI-compatible model"
license = "LGPL-3.0-or-later"
repository = "https://github.com/iMMIQ/ferryman"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
lol_html = "0.4"
roxmltree = "0.20"
indicatif = "0.17"
futures = "0.3"
sha2 = "0.10"
axum = { version = "0.8", features = ["multipart"] }
libc = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
pdf-extract = "0.12"
lopdf = { version = "0.42", default-features = false, features = ["wasm_js"] }
ttf-parser = "0.25"
# PDF font subsetting (same crate krilla uses; renumbers glyph ids)
subsetter = "0.2"

[dev-dependencies]
# test fixtures build source PDFs with a known layout for the pdf backend
krilla = { version = "0.8", default-features = false, features = ["simple-text"] }

[profile.release]
opt-level = 2
