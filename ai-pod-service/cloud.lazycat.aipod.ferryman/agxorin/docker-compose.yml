services:
  ferryman-agent:
    image: docker.io/catdogai/lzc-aipod-vllm:agxorin-cu126-src-18f658bb3185-20260703@sha256:079f2ab5a3f19da5fbdf930476fed73625c3d47085407280fbee48c4293279be
    entrypoint: ["/usr/local/bin/ferryman-agent"]
    shm_size: 512m
    restart: unless-stopped
    # Agent health is independent of an on-demand model's loaded state.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      FERRYMAN_AGENT_LISTEN: 0.0.0.0:8090
      FERRYMAN_AUTH_STATE_FILE: /auth/token.sha256
      FERRYMAN_MODEL_ROOT: /models
      FERRYMAN_CACHE_ROOT: /root/.cache
      FERRYMAN_IDLE_TIMEOUT_SECONDS: 600
      RUST_LOG: info
      LD_PRELOAD: ""
      VLLM_CONFIGURE_LOGGING: "0"
      VLLM_DO_NOT_TRACK: "1"
      VLLM_NO_USAGE_STATS: "1"
      TRITON_CACHE_DIR: /root/.cache/triton
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
    volumes:
      - ./ferryman-agent:/usr/local/bin/ferryman-agent:ro
      - ${LZC_AGENT_DATA_DIR}/auth:/auth
      - ${LZC_AGENT_DATA_DIR}/models:/models
      - ${LZC_AGENT_CACHE_DIR}/vllm:/root/.cache
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${LZC_SERVICE_ID}-ferryman.rule=Host(`ferryman-agent-ai`)"
      - "traefik.http.services.${LZC_SERVICE_ID}-ferryman.loadbalancer.server.port=8090"

networks:
  default:
    external: true
    name: traefik-shared-network
