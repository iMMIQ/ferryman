services:
  ferryman-agent:
    image: ${FERRYMAN_RUNTIME_IMAGE:-debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251}
    entrypoint: ["/usr/local/bin/ferryman-agent"]
    runtime: nvidia
    shm_size: 512m
    restart: unless-stopped
    # Agent health is independent of an on-demand model's loaded state.
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8090; printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      FERRYMAN_AGENT_LISTEN: 0.0.0.0:8090
      FERRYMAN_AUTH_STATE_FILE: /auth/token.sha256
      FERRYMAN_MODEL_ROOT: /models
      FERRYMAN_ORINFER_ENDPOINT: http://127.0.0.1:18088
      FERRYMAN_CACHE_ROOT: /root/.cache/ferryman
      FERRYMAN_IDLE_TIMEOUT_SECONDS: 600
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      RUST_LOG: info
      PATH: /opt/orinfer/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ORINFER_EXECUTION_CACHE: /opt/orinfer/packages
    volumes:
      - ./orinfer:/opt/orinfer:ro
      - ./ferryman-agent:/usr/local/bin/ferryman-agent:ro
      - ${LZC_AGENT_DATA_DIR}/auth:/auth
      - ${LZC_AGENT_DATA_DIR}/models:/models
      - ${LZC_AGENT_CACHE_DIR}/orinfer:/root/.cache
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${LZC_SERVICE_ID}-ferryman.rule=Host(`ferryman-agent-ai`)"
      - "traefik.http.services.${LZC_SERVICE_ID}-ferryman.loadbalancer.server.port=8090"

networks:
  default:
    external: true
    name: traefik-shared-network
