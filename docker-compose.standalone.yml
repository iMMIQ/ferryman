# Ferryman single-image deployment; inference uses an external model API.
# on one host, no Lazycat platform required. Configure via .env (see
# .env.example), then: docker compose -f docker-compose.standalone.yml up -d --build

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: ferryman-web:standalone
    restart: unless-stopped
    ports:
      - "${FERRYMAN_WEB_PORT:-8080}:8080"
    environment:
      FERRYMAN_DATA_DIR: /data
      FERRYMAN_USER_DOCUMENTS_DIR: /documents
      FERRYMAN_REMOTE_FS_DIR: /remotefs
      # Single-user mode: every visitor shares the local-development-user
      # identity. Keep the port off the public internet, or put an
      # authenticating reverse proxy in front that injects safe_uid.
      FERRYMAN_ALLOW_LOCAL_USER: "true"
      RUST_LOG: info
    volumes:
      - ${FERRYMAN_DATA_DIR:-./data}:/data
      - ${FERRYMAN_DOCS_DIR:-./documents}:/documents
      - ${FERRYMAN_REMOTEFS_DIR:-./remotefs}:/remotefs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/config"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
