ext_config:
  enable_document_access: true
  enable_media_access: true

application:
  subdomain: ferryman
  routes:
    - /=http://web:8080
  health_check:
    test_url: http://web:8080/api/config
    start_period: 30s

services:
  web:
    image: embed:ferryman-web
    environment:
      - FERRYMAN_WEB_LISTEN=0.0.0.0:8080
      - FERRYMAN_WEB_DIR=/app/web
      - FERRYMAN_DATA_DIR=/lzcapp/var/ferryman
      - FERRYMAN_USER_DOCUMENTS_DIR=/lzcapp/run/mnt/home
      - FERRYMAN_REMOTE_FS_DIR=/lzcapp/media/RemoteFS
      - FERRYMAN_AGENT_URL=https://ferryman-agent-ai.{{ .S.BoxDomain }}
      # Generated and persisted by Web on first startup; never embedded in the LPK.
      - FERRYMAN_AGENT_PAIRING=true
      - FERRYMAN_ALLOW_LOCAL_USER=false
      - RUST_LOG=info
